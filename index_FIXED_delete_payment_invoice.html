<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>PROJECT RECORDS</title>
<style>
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{background:#111827;color:white;padding:25px 18px}main{max-width:720px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}h1,h2{margin:0 0 10px}.grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f8fafc;padding:12px;border-radius:12px}.stat small{color:#6b7280}.stat b{display:block;font-size:19px;margin-top:4px}label{display:block;font-size:13px;color:#6b7280;margin:9px 0 5px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box}button{background:#111827;color:white;border:0;border-radius:10px;padding:12px 15px;font-weight:700;margin-top:10px}.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #eee;padding:11px 0}.muted{color:#6b7280;font-size:13px}.hidden{display:none}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><h1>PROJECT RECORDS</h1><div>Private project & profit tracker</div></header><main>
<section id="setup" class="card"><h2>Create your first project</h2><label>Project name</label><input id="n" value="217B CENTRAL GARDEN AVENUE"><label>Contract value (SGD)</label><input id="c" type="number" value="8000"><button onclick="create()">Create Project</button></section>
<section id="app" class="hidden">
<div class="card"><label>Project</label><select id="sel" onchange="pick(this.value)"></select><button onclick="newProject()">+ New Project</button></div>
<div class="card"><h2>📊 Dashboard</h2><div class="stats"><div class="stat"><small>Contract</small><b id="contract">$0</b></div><div class="stat"><small>Received</small><b id="received">$0</b></div><div class="stat"><small>Expenses</small><b id="expensesTotal">$0</b></div><div class="stat"><small>Actual Profit</small><b id="profit">$0</b></div></div><div class="stats" style="margin-top:10px"><div class="stat"><small>Outstanding</small><b id="outstanding">$0</b></div><div class="stat"><small>Profit Margin</small><b id="margin">0%</b></div></div></div>
<div class="card"><h2>📋 Project Information</h2><label>Project name</label><input id="pn"><label>Contract value (SGD)</label><input id="pc" type="number"><label>Client</label><input id="client"><label>Status</label><select id="status"><option>ONGOING</option><option>COMPLETED</option><option>ON HOLD</option></select><button onclick="saveInfo()">Save Information</button></div>
<div class="card"><h2>💰 Payments / Deposits</h2><div id="payments"></div><label>Amount (SGD)</label><input id="pa" type="number"><label>Note</label><input id="pt" placeholder="Deposit / Progress / Final"><button onclick="addPay()">+ Add Payment</button></div>
<div class="card"><h2>💳 Expenses</h2><div id="expenseList"></div><label>Category</label><select id="ec"><option>Materials</option><option>Labour</option><option>Transport</option><option>Subcontractor</option><option>Other</option></select><label>Description</label><input id="ed" placeholder="Hardware materials"><label>Amount (SGD)</label><input id="ea" type="number"><button onclick="addExp()">+ Add Expense</button></div>
<div class="card"><h2>🧾 Invoices</h2><div id="invoiceList"></div><label>Invoice No.</label><input id="ino" placeholder="INV-001"><label>Amount (SGD)</label><input id="ia" type="number"><label>Note</label><input id="it" placeholder="Deposit / Progress / Final"><button onclick="addInv()">+ Add Invoice</button></div>
</section></main>
<script>
let db=JSON.parse(localStorage.getItem("PRDB")||'{"projects":[],"current":null}');
const $=id=>document.getElementById(id), money=x=>new Intl.NumberFormat("en-SG",{style:"currency",currency:"SGD"}).format(x||0);
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const save=()=>localStorage.setItem("PRDB",JSON.stringify(db)), cur=()=>db.projects.find(p=>p.id===db.current);
function create(){let p={id:id(),name:$("n").value||"New Project",contract:+$("c").value||0,client:"",status:"ONGOING",payments:[],expenses:[],invoices:[]};db.projects.push(p);db.current=p.id;save();render()}
function newProject(){let name=prompt("Project name");if(!name)return;let contract=+prompt("Contract value (SGD)","0")||0;let p={id:id(),name,contract,client:"",status:"ONGOING",payments:[],expenses:[],invoices:[]};db.projects.push(p);db.current=p.id;save();render()}
function pick(x){db.current=x;save();render()}
function saveInfo(){let p=cur();p.name=$("pn").value;p.contract=+$("pc").value||0;p.client=$("client").value;p.status=$("status").value;save();render()}
function addPay(){let p=cur(),a=+$("pa").value;if(!a)return alert("Enter amount");p.payments.push({id:id(),amount:a,note:$("pt").value||"Payment"});$("pa").value="";$("pt").value="";save();render()}
function addExp(){let p=cur(),a=+$("ea").value,d=$("ed").value.trim();if(!a||!d)return alert("Enter description and amount");p.expenses.push({id:id(),amount:a,cat:$("ec").value,desc:d});$("ea").value="";$("ed").value="";save();render()}
function addInv(){let p=cur(),a=+$("ia").value,no=$("ino").value.trim();if(!a||!no)return alert("Enter invoice no. and amount");p.invoices.push({id:id(),amount:a,no,note:$("it").value});$("ia").value="";$("ino").value="";$("it").value="";save();render()}
function rem(t,x){let p=cur();p[t]=p[t].filter(v=>v.id!==x);save();render()}
function esc(s){return String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(){if(!db.projects.length){$("setup").classList.remove("hidden");$("app").classList.add("hidden");return}$("setup").classList.add("hidden");$("app").classList.remove("hidden");let p=cur();$("sel").innerHTML=db.projects.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("");$("sel").value=p.id;$("pn").value=p.name;$("pc").value=p.contract;$("client").value=p.client;$("status").value=p.status;let r=p.payments.reduce((a,x)=>a+x.amount,0),e=p.expenses.reduce((a,x)=>a+x.amount,0),pr=p.contract-e,o=p.contract-r;$("contract").textContent=money(p.contract);$("received").textContent=money(r);$("expensesTotal").textContent=money(e);$("profit").textContent=money(pr);$("outstanding").textContent=money(o);$("margin").textContent=(p.contract?pr/p.contract*100:0).toFixed(1)+"%";$("payments").innerHTML=p.payments.length?p.payments.map(x=>'<div class="row"><div><b>'+money(x.amount)+'</b><div class="muted">'+esc(x.note)+'</div></div><button class="danger" onclick="rem(\'payments\',\''+x.id+'\')">Delete</button></div>').join(""):"<div class='muted'>No payments yet.</div>";$("expenseList").innerHTML=p.expenses.length?p.expenses.map(x=>'<div class="row"><div><b>'+money(x.amount)+'</b><div class="muted">'+esc(x.cat)+" · "+esc(x.desc)+'</div></div><button class="danger" onclick="rem(\'expenses\',\''+x.id+'\')">Delete</button></div>').join(""):"<div class='muted'>No expenses yet.</div>";$("invoiceList").innerHTML=p.invoices.length?p.invoices.map(x=>'<div class="row"><div><b>'+esc(x.no)+" · "+money(x.amount)+'</b><div class="muted">'+esc(x.note)+'</div></div><button class="danger" onclick="rem(\'invoices\',\''+x.id+'\')">Delete</button></div>').join(""):"<div class='muted'>No invoices yet.</div>"}
render();
</script></body></html>
