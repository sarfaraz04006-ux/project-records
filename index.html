<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Project Records</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
h1{font-size:24px;margin:0 0 4px}.sub{opacity:.75;font-size:13px}
main{padding:16px;max-width:760px;margin:auto}.card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f9fafb;border-radius:12px;padding:12px}.label{font-size:12px;color:#6b7280}.value{font-size:20px;font-weight:700;margin-top:4px}
button{border:0;border-radius:11px;padding:12px 14px;font-weight:700;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px;font-size:16px;background:white}label{display:block;font-size:13px;color:#4b5563;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.section-title{font-size:17px;font-weight:800;margin-bottom:10px}.item{padding:12px 0;border-top:1px solid #e5e7eb}.item:first-child{border-top:0}.small{font-size:12px;color:#6b7280}.amount{font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#app{display:none}.empty{text-align:center;color:#6b7280;padding:20px}
</style>
</head>
<body>
<header><h1>PROJECT RECORDS</h1><div class="sub">Private project & profit tracker</div></header>
<main>
<div id="app"></div>
<div id="setup" class="card">
  <div class="section-title">Create your first project</div>
  <label>Project name<input id="pname" value="217B CENTRAL GARDEN AVENUE"></label>
  <label>Contract value (SGD)<input id="contract" type="number" value="8000"></label>
  <button class="primary" onclick="createProject()">Create Project</button>
</div>
</main>
<script>
const KEY="project_records_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"null");
const money=n=>"SGD "+Number(n||0).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function createProject(){data={projects:[{id:Date.now(),name:document.getElementById("pname").value||"New Project",contract:+document.getElementById("contract").value||0,payments:[],expenses:[],invoices:[],notes:[]}],active:0};save()}
function current(){return data.projects[data.active]}
function total(a){return a.reduce((s,x)=>s+Number(x.amount||0),0)}
function addPayment(){let p=current(),a=prompt("Payment received amount (SGD)");if(a===null)return;let d=prompt("Description (e.g. Deposit)","Deposit");p.payments.push({amount:+a||0,desc:d||"Payment",date:new Date().toLocaleDateString("en-SG")});save()}
function addExpense(){let p=current(),a=prompt("Expense amount (SGD)");if(a===null)return;let desc=prompt("Description","Hardware materials");let cat=prompt("Category","Materials");p.expenses.push({amount:+a||0,desc:desc||"Expense",cat:cat||"Other",date:new Date().toLocaleDateString("en-SG")});save()}
function addInvoice(){let p=current(),a=prompt("Invoice amount (SGD)");if(a===null)return;let no=prompt("Invoice number","INV-001");p.invoices.push({amount:+a||0,no:no||"Invoice",date:new Date().toLocaleDateString("en-SG")});save()}
function addProject(){let n=prompt("New project name");if(!n)return;let c=prompt("Contract value (SGD)","0");data.projects.push({id:Date.now(),name:n,contract:+c||0,payments:[],expenses:[],invoices:[],notes:[]});data.active=data.projects.length-1;save()}
function deleteExpense(i){if(confirm("Delete this expense?")){current().expenses.splice(i,1);save()}}
function render(){
 if(!data){document.getElementById("setup").style.display="block";document.getElementById("app").style.display="none";return}
 document.getElementById("setup").style.display="none";document.getElementById("app").style.display="block";
 let p=current(),received=total(p.payments),expenses=total(p.expenses),profit=p.contract-expenses,outstanding=p.contract-received,margin=p.contract?profit/p.contract*100:0;
 document.getElementById("app").innerHTML=`
 <div class="card">
   <div class="row"><div><div class="section-title">${esc(p.name)}</div><div class="small">Project ${data.active+1} of ${data.projects.length}</div></div><button class="secondary" onclick="addProject()">＋ Project</button></div>
 </div>
 <div class="card"><div class="section-title">📊 Dashboard</div>
   <div class="grid">
    <div class="stat"><div class="label">Contract</div><div class="value">${money(p.contract)}</div></div>
    <div class="stat"><div class="label">Received</div><div class="value">${money(received)}</div></div>
    <div class="stat"><div class="label">Expenses</div><div class="value">${money(expenses)}</div></div>
    <div class="stat"><div class="label">Actual Profit</div><div class="value">${money(profit)}</div></div>
    <div class="stat"><div class="label">Outstanding</div><div class="value">${money(outstanding)}</div></div>
    <div class="stat"><div class="label">Profit Margin</div><div class="value">${margin.toFixed(1)}%</div></div>
   </div>
 </div>
 <div class="card"><div class="section-title">💵 Payments</div><button class="primary" onclick="addPayment()">＋ Add Payment</button>
 ${p.payments.map(x=>`<div class="item"><span>${esc(x.desc)} <span class="small">${x.date}</span></span><span class="amount">${money(x.amount)}</span></div>`).join("")||'<div class="empty">No payments yet</div>'}</div>
 <div class="card"><div class="section-title">💳 Expenses</div><button class="primary" onclick="addExpense()">＋ Add Expense</button>
 ${p.expenses.map((x,i)=>`<div class="item"><div class="row"><span><b>${esc(x.desc)}</b><br><span class="small">${esc(x.cat)} · ${x.date}</span></span><span class="amount">${money(x.amount)}</span></div><div class="actions"><button class="danger" onclick="deleteExpense(${i})">Delete</button></div></div>`).join("")||'<div class="empty">No expenses yet</div>'}</div>
 <div class="card"><div class="section-title">🧾 Invoices</div><button class="primary" onclick="addInvoice()">＋ Add Invoice</button>
 ${p.invoices.map(x=>`<div class="item"><span>${esc(x.no)} <span class="small">${x.date}</span></span><span class="amount">${money(x.amount)}</span></div>`).join("")||'<div class="empty">No invoices yet</div>'}</div>
 <div class="card"><div class="section-title">📁 Project Records</div><div class="small">Use your WhatsApp project group for photos, drawings, materials, progress and completion records. This app handles the structured financial calculation.</div></div>
 <div class="card"><div class="section-title">Projects</div><select onchange="data.active=+this.value;save()">${data.projects.map((x,i)=>`<option value="${i}" ${i===data.active?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
 `;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body></html>
